# Layout and appearance are local to this style; selecting it is a separate action.
theme = "macchiato"
leading = ["workspaces", "media"]
center = ["active-window"]
# Agent status, then shared notifications/controls, Bluetooth/volume/battery, weather/clock.
trailing = ["agents", "control-center", "bluetooth", "weather"]

[workspaceBar]
position = "overlappingMenuBar"
height = 38
fullWidth = true
fullWidthNotchMode = "splitAroundNotch"
notchMode = "moveBelowMenuBar"
reserveLayoutSpace = false
transparentBackground = true
backgroundOpacity = 0
showItemBackgrounds = true
showAccentHighlights = true
solidBlackBackground = false
showLabels = true
systemStatsButton = false
xOffset = 0
yOffset = 0

[widgets.workspaces]
indicator = "pills"
compact = false

[widgets.media]
interval = 1

[widgets.weather]
date = true
icon = true

[widgets.bluetooth]
interval = 15
percent = "beside"
