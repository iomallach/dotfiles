# Layout and appearance are local to this style; selecting it is a separate action.
theme = "macchiato"
leading = ["workspaces", "media"]
center = ["active-window"]
trailing = ["weather", "notifications", "bluetooth", "volume", "battery-details", "control-center", "clock"]

[workspaceBar]
position = "overlappingMenuBar"
height = 38
fullWidth = true
fullWidthNotchMode = "splitAroundNotch"
notchMode = "moveBelowMenuBar"
reserveLayoutSpace = false
transparentBackground = true
backgroundOpacity = 0
showItemBackgrounds = true
showAccentHighlights = true
solidBlackBackground = false
showLabels = true
systemStatsButton = false
xOffset = 0
yOffset = 0

[widgets.workspaces]
indicator = "pills"
compact = false

[widgets.clock]
date = true
icon = true

[widgets.battery-details]
percent = "beside"

[widgets.bluetooth]
interval = 15
